name: PanelPilot
options:
  bundleIdPrefix: com.agent2api
  deploymentTarget:
    iOS: "16.4"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "15.4"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.4"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  PanelPilot:
    type: application
    platform: iOS
    deploymentTarget: "16.4"
    sources:
      - path: PanelPilot
        excludes:
          - "Resources/Info.plist"
          - "Resources/.gitkeep"
    info:
      path: PanelPilot/Resources/Info.plist
      properties:
        CFBundleDisplayName: 面板控制台
        # 引用 build settings，别再写死 —— 写死会出现「MARKETING_VERSION 改了、
        # 包里的版本号没变」的鬼故事（2.6.2 第一次构建就踩了这个坑）。
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: zh-Hans
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Light
        UIStatusBarStyle: UIStatusBarStyleDarkContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: 用于在局域网内连接你电脑上的 Agent2API 面板，读取运行状态与账号信息。数据只在手机与你的电脑之间传输。
        # 公网一律走 TLS。这里刻意把 NSAllowsArbitraryLoads 关掉，只留
        # 「本地网络」豁免：局域网 http://192.168.x.x:3065 还能连，
        # 但公网 IP / 域名的明文 http 会被 ATS 直接拦成 -1022。
        # （这两个键同时存在时 NSAllowsArbitraryLoads 会被忽略当 NO，
        #   正好用来把「不能用明文」变成编译期就锁死的规则。）
        # Tailscale 的 100.x 不在本地网络范围里，走 ts.net 的 https 域名即可。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsLocalNetworking: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agent2api.PanelPilot
        PRODUCT_NAME: PanelPilot
        MARKETING_VERSION: "2.7.7"
        CURRENT_PROJECT_VERSION: "30"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_CFBundleDisplayName: 面板控制台

schemes:
  PanelPilot:
    build:
      targets:
        PanelPilot: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
