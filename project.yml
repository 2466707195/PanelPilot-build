name: PanelPilot
options:
  bundleIdPrefix: com.agent2api
  deploymentTarget:
    iOS: "16.4"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "15.4"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.4"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  PanelPilot:
    type: application
    platform: iOS
    deploymentTarget: "16.4"
    sources:
      - path: PanelPilot
        excludes:
          - "Resources/Info.plist"
          - "Resources/.gitkeep"
    info:
      path: PanelPilot/Resources/Info.plist
      properties:
        CFBundleDisplayName: 面板控制台
        CFBundleShortVersionString: "2.5.2"
        CFBundleVersion: "13"
        CFBundleDevelopmentRegion: zh-Hans
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Light
        UIStatusBarStyle: UIStatusBarStyleDarkContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: 用于在局域网内连接你电脑上的 Agent2API 面板，读取运行状态与账号信息。数据只在手机与你的电脑之间传输。
        # 只有一个键：NSAllowsArbitraryLoads。
        # 千万不能同时写 NSAllowsLocalNetworking —— iOS 10 起，只要 plist 里出现
        # NSAllowsLocalNetworking / NSAllowsArbitraryLoadsForMedia /
        # NSAllowsArbitraryLoadsInWebContent 任意一个，NSAllowsArbitraryLoads
        # 就会被忽略并当作 NO；再叠加 iOS 17+「默认不放行 IP 地址」，
        # 明文 http://IP:port 一律被 ATS 拦成 -1022。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agent2api.PanelPilot
        PRODUCT_NAME: PanelPilot
        MARKETING_VERSION: "2.5.2"
        CURRENT_PROJECT_VERSION: "13"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_CFBundleDisplayName: 面板控制台

schemes:
  PanelPilot:
    build:
      targets:
        PanelPilot: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
