name: debug
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-xcodegen.sh
      - name: select 26.3 and list
        run: |
          xcodegen generate
          sudo xcode-select -s /Applications/Xcode_26.3.app || true
          xcodebuild -version || true
          echo "--- list under 26.3 ---"
          xcodebuild -list -project PanelPilot.xcodeproj 2>&1 | tail -30 || true
          echo "--- list under 16.4 ---"
          sudo xcode-select -s /Applications/Xcode_16.4.app || true
          xcodebuild -list -project PanelPilot.xcodeproj 2>&1 | tail -15 || true
