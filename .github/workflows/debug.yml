name: debug
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-xcodegen.sh
      - name: generate and list
        run: |
          xcodegen generate
          echo "--- xcodebuild -list ---"
          xcodebuild -list -project PanelPilot.xcodeproj 2>&1 | tail -40 || true
          echo "--- project head ---"
          head -30 PanelPilot.xcodeproj/project.pbxproj || true
